<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>okstratr observer panel</title>
  <link rel="stylesheet" href="observer.css" />
</head>
<body>
  <header class="top">
    <div class="brand">okstratr · observer panel</div>
    <div class="chips" id="chips">
      <span class="chip" id="chip-board">board: …</span>
      <span class="chip" id="chip-web">web: …</span>
      <span class="chip" id="chip-harness">harness: …</span>
      <span class="chip" id="chip-dur">up: …</span>
    </div>
    <div class="actions">
      <button type="button" id="btn-refresh">Refresh</button>
      <button type="button" id="btn-docs">Open docs</button>
    </div>
  </header>

  <main class="grid">
    <section class="card" id="desks-card">
      <h2>Desks</h2>
      <div id="desks" class="list">Loading…</div>
    </section>
    <section class="card" id="dag-card">
      <h2>DAG</h2>
      <div id="dag" class="list">Loading…</div>
    </section>
    <section class="card" id="settings-card">
      <h2>Settings</h2>
      <dl id="settings" class="settings">
        <dt>serve</dt><dd id="s-serve">…</dd>
        <dt>observer</dt><dd id="s-observer">…</dd>
        <dt>cwd / backend</dt><dd id="s-cwd">…</dd>
        <dt>tokens</dt><dd id="s-tokens">n/a</dd>
        <dt>files / lines</dt><dd id="s-files">…</dd>
      </dl>
      <p class="hint">Chat stays in Herdr / CLI harnesses. This panel is desks + DAG only.</p>
    </section>
  </main>

  <footer class="foot">
    <span id="poll-status">polling…</span>
    <a href="/health" id="health-link">/health</a>
  </footer>
  <script src="observer.js"></script>
</body>
</html>
