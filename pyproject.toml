[project]
name = "okstratr"
version = "0.1.0"
description = "CLI/TUI desk-brain orchestrator — harness-agnostic seating, DAG, CoS, blackboard; pairs with Herdr (Omarchy Panel is a client)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ben Smith" }]
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.80"]
dev = ["pytest>=8"]

[project.scripts]
okstratr = "okstratr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
okstratr = ["observer/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
