[project]
name = "okstratr"
version = "0.1.0"
description = "Desk-brain kernel + skill: observer panel (primary visual), harness-agnostic seating, DAG, CoS, blackboard; Herdr/CLI = text I/O; Omarchy QML optional"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ben Smith" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
okstratr = "okstratr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
okstratr = ["observer/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
